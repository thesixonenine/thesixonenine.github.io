name: Deploy to Github Pages

on:
    workflow_dispatch:
    push:
        branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                submodules: recursive
            - uses: actions/setup-go@v7
              with:
                  go-version: "^1.27.1"
            - uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "latest"
                  extended: true
            - name: Build
              run: hugo --minify --gc --baseURL "https://thesixonenine.github.io/"
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./public
    deploy:
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v5
